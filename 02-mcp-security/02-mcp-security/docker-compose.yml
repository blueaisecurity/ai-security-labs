services:
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]

  mcp-server:
    build: ./mcp-server
    ports: ["9000:9000"]        # exposed so MCP Inspector on your host can connect too

  chatbot:
    build: ./chatbot
    ports: ["8000:8000"]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - MCP_URL=http://mcp-server:9000/sse
    depends_on: [ollama, mcp-server]

volumes:
  ollama:
