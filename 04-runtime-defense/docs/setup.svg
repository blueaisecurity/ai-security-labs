<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" width="720" height="240" font-family="Segoe UI, Arial, sans-serif">
  <title>The lab: browser, agent, MCP server, the LiteLLM gateway with Postgres, and Ollama with two models</title>
  <rect x="0" y="0" width="720" height="240" rx="10" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
  <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#be185d"/></marker></defs>
  <rect x="10" y="80" width="110" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="65" y="106" text-anchor="middle" font-size="13" font-weight="600">Browser</text>
  <text x="65" y="124" text-anchor="middle" font-size="10" fill="#475569">localhost:8000</text>
  <rect x="160" y="70" width="140" height="80" rx="8" fill="#e0f2fe" stroke="#0369a1"/>
  <text x="230" y="98" text-anchor="middle" font-size="13" font-weight="600">Agent</text>
  <text x="230" y="116" text-anchor="middle" font-size="10" fill="#475569">container "agent"</text>
  <text x="230" y="131" text-anchor="middle" font-size="10" fill="#475569">the loop + the web page</text>
  <rect x="345" y="40" width="190" height="140" rx="8" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/>
  <text x="440" y="64" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">AI GATEWAY (LiteLLM)</text>
  <text x="440" y="82" text-anchor="middle" font-size="10" fill="#475569">container "gateway", :4000</text>
  <text x="440" y="106" text-anchor="middle" font-size="10.5">before the model: pre_call checks</text>
  <text x="440" y="124" text-anchor="middle" font-size="10.5">after the model: post_call checks</text>
  <text x="440" y="148" text-anchor="middle" font-size="10" fill="#475569">config.yaml + lab_checks.py</text>
  <text x="440" y="164" text-anchor="middle" font-size="10" fill="#475569">decision log, dashboard :4000/ui</text>
  <line x1="440" y1="180" x2="440" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="380" y="196" width="120" height="38" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="440" y="212" text-anchor="middle" font-size="11.5" font-weight="600">Postgres</text>
  <text x="440" y="226" text-anchor="middle" font-size="9" fill="#475569">the dashboard's database</text>
  <rect x="578" y="28" width="136" height="176" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="646" y="47" text-anchor="middle" font-size="13" font-weight="600">Ollama</text>
  <text x="646" y="61" text-anchor="middle" font-size="9.5" fill="#475569">container "ollama", local</text>
  <rect x="590" y="72" width="112" height="52" rx="6" fill="#ffffff" stroke="#475569"/>
  <text x="646" y="92" text-anchor="middle" font-size="11.5" font-weight="600">qwen2.5:3b</text>
  <text x="646" y="106" text-anchor="middle" font-size="9.5" fill="#475569">the agent's model</text>
  <text x="646" y="117" text-anchor="middle" font-size="9.5" fill="#475569">1.9 GB</text>
  <rect x="590" y="136" width="112" height="56" rx="6" fill="#ffffff" stroke="#be185d" stroke-width="1.5"/>
  <text x="646" y="155" text-anchor="middle" font-size="11.5" font-weight="600">qwen2.5:7b</text>
  <text x="646" y="170" text-anchor="middle" font-size="9.5" fill="#475569">the judge's model,</text>
  <text x="646" y="183" text-anchor="middle" font-size="9.5" fill="#475569">the bigger one, 4.7 GB</text>
  <rect x="160" y="190" width="140" height="40" rx="8" fill="#fef3c7" stroke="#b45309"/>
  <text x="230" y="208" text-anchor="middle" font-size="12" font-weight="600">MCP server</text>
  <text x="230" y="223" text-anchor="middle" font-size="9.5" fill="#475569">fake inbox + mock send_email</text>
  <line x1="120" y1="110" x2="158" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="300" y1="110" x2="343" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="535" y1="96" x2="588" y2="96" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="535" y1="164" x2="588" y2="164" stroke="#be185d" stroke-width="1.5" marker-end="url(#arp)"/>
  <text x="561" y="156" text-anchor="middle" font-size="8.5" fill="#be185d">judge's</text>
  <text x="561" y="178" text-anchor="middle" font-size="8.5" fill="#be185d">question</text>
  <line x1="230" y1="150" x2="230" y2="188" stroke="#475569" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="240" y="167" font-size="9.5" fill="#475569">tools run here,</text>
  <text x="240" y="180" font-size="9.5" fill="#475569">not in the gateway</text>
  <text x="322" y="102" text-anchor="middle" font-size="9" fill="#475569">every</text>
  <text x="322" y="128" text-anchor="middle" font-size="9" fill="#475569">model call</text>
</svg>
