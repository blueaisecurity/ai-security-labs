services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  chatbot:
    build: ./vuln-chatbot
    ports: ["8000:8000"]
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2
      - LAB_SECRET=SWORDFISH
      - LAB_LEVEL=${LAB_LEVEL:-1}   # reads from your shell; defaults to level 1
    depends_on: [ollama]

volumes:
  ollama:
